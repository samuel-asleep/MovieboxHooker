name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate throwaway keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/throwaway.jks \
            -alias throwaway \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug, OU=Dev, O=None, L=None, ST=None, C=US"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Sign APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          SIGNED_APK="app/build/outputs/apk/release/MovieBoxHooker-signed.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks ${{ github.workspace }}/throwaway.jks \
            --ks-key-alias "throwaway" \
            --ks-pass "pass:android" \
            --key-pass "pass:android" \
            --out "$SIGNED_APK" \
            "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBoxHooker-APK
          path: app/build/outputs/apk/release/MovieBoxHooker-signed.apk
          if-no-files-found: error
