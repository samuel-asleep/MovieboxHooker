name: Build & Release APK

on:
  push:
    tags:
      - "v*"           # triggers on any tag like v1.0, v2.0.1, etc.
  workflow_dispatch:   # also allow manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21 required — Gradle 8.x does NOT support JDK 17 with AGP 8.9+
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Write local.properties so Gradle finds the Android SDK
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ── Signing ──────────────────────────────────────────────────────────
      # To enable signed builds, add these secrets in your repo settings:
      #   KEYSTORE_BASE64   → base64 of your .jks file  (base64 -w0 mykeystore.jks)
      #   KEY_ALIAS         → key alias inside the keystore
      #   KEY_PASSWORD      → key password
      #   STORE_PASSWORD    → keystore password
      #
      # If the secrets are absent the APK is built unsigned (debug-usable via LSPatch).
      - name: Decode keystore (if secrets present)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.jks

      - name: Build release APK
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PATH:  ${{ github.workspace }}/release.jks
        run: ./gradlew :app:assembleRelease

      # ── Sign with apksigner if keystore was decoded ───────────────────────
      - name: Sign APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          SIGNED_APK="app/build/outputs/apk/release/MovieBoxHooker-signed.apk"
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner sign \
            --ks ${{ github.workspace }}/release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$APK"
          echo "SIGNED_APK=$SIGNED_APK" >> $GITHUB_ENV

      # Rename unsigned APK so the artifact name is always clean
      - name: Rename unsigned APK
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          RENAMED="app/build/outputs/apk/release/MovieBoxHooker-unsigned.apk"
          mv "$APK" "$RENAMED"
          echo "SIGNED_APK=$RENAMED" >> $GITHUB_ENV

      # ── Upload as workflow artifact (always) ──────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBoxHooker-APK
          path: app/build/outputs/apk/release/MovieBoxHooker-*.apk
          if-no-files-found: error

      # ── Create GitHub Release (only on tag pushes) ────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/MovieBoxHooker-*.apk
          generate_release_notes: true
          body: |
            ## MovieBox Hooker ${{ github.ref_name }}

            ### Installation
            **Root (LSPosed):** Install APK → enable in LSPosed → scope to `com.community.oneroom` → reboot.
            **Non-root (LSPatch):** Patch MovieBox APK with this module in LSPatch → install output.

            ### What's unlocked
            - ✅ VIP / Premium content
            - ✅ HD / 4K resolutions
            - ✅ Unlimited downloads
            - ✅ Ads removed
